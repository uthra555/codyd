name: Daily Job Check to Discord

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '조회할 기간(일). 기본값 1 = 어제 하루만 조회'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: '1'
      ACTIONS_NODE24_WARNING: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1' }}
        run: python main.py
